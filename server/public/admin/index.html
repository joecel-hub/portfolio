<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stryg.Bytes — Admin</title>
<style>
  :root {
    --bg: #0a0b12;
    --panel: #12141f;
    --panel-2: #171a28;
    --border: #23273a;
    --text: #e8e9f2;
    --muted: #8b90a7;
    --acc: #7c6eff;
    --acc2: #43e97b;
    --pink: #ff6ebc;
    --danger: #ff5c6c;
    --radius: 12px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
  .logo { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; letter-spacing: .3px; color: var(--acc); }
  .logo span { color: var(--text); }
  .muted { color: var(--muted); font-size: .9rem; }
  .btn {
    font-family: var(--sans); font-size: .92rem; font-weight: 600; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); padding: .55rem 1rem; border-radius: 9px; cursor: pointer;
    transition: .15s; display: inline-flex; align-items: center; gap: .45rem;
  }
  .btn:hover { border-color: var(--acc); color: var(--acc); }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); color: #fff; }
  .btn.danger { background: transparent; border-color: rgba(255,92,108,.4); color: var(--danger); }
  .btn.danger:hover { background: rgba(255,92,108,.12); }
  .btn.sm { padding: .35rem .7rem; font-size: .82rem; }
  .btn.green { background: var(--acc2); border-color: var(--acc2); color: #06110b; }
  .btn.green:hover { filter: brightness(1.08); color: #06110b; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* login */
  .auth-box { max-width: 360px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; }
  .auth-box h1 { font-size: 1.3rem; margin-bottom: .3rem; }
  .auth-box p { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: .7rem .8rem; border-radius: 9px; font-size: .95rem; font-family: var(--sans);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--acc); }
  .err { color: var(--danger); font-size: .85rem; min-height: 1.2em; margin-top: .5rem; }
  /* tabs */
  .tabs { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: .75rem; }
  .tab { background: transparent; border: 1px solid transparent; color: var(--muted); font-family: var(--mono); font-size: .9rem; padding: .5rem .9rem; border-radius: 8px; cursor: pointer; transition: .15s; display: flex; gap: .45rem; align-items: center; }
  .tab:hover { color: var(--text); background: var(--panel); }
  .tab.active { background: rgba(124,110,255,.12); color: var(--acc); border-color: rgba(124,110,255,.35); }
  .tab .badge { background: var(--pink); color: #1a0510; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: .05rem .45rem; min-width: 1.2rem; text-align: center; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .panel + .panel { margin-top: 1rem; }
  .row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .card-list { display: grid; gap: .75rem; }
  .item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .item .grow { flex: 1; min-width: 200px; }
  .item .title { font-weight: 600; font-size: .98rem; }
  .item .sub { color: var(--muted); font-size: .84rem; margin-top: .2rem; }
  .tags { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .4rem; }
  .tag { font-family: var(--mono); font-size: .72rem; color: var(--acc); background: rgba(124,110,255,.12); border: 1px solid rgba(124,110,255,.25); padding: .12rem .5rem; border-radius: 999px; }
  .status { font-family: var(--mono); font-size: .75rem; padding: .2rem .6rem; border-radius: 999px; }
  .status.pending { background: rgba(255,199,92,.15); color: #ffc75c; border: 1px solid rgba(255,199,92,.35); }
  .status.approved { background: rgba(67,233,123,.14); color: var(--acc2); border: 1px solid rgba(67,233,123,.35); }
  .stars { color: #ffc75c; font-size: .78rem; letter-spacing: 1px; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .titlebar h2 { font-family: var(--mono); font-size: 1.05rem; font-weight: 650; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-grid .full { grid-column: 1 / -1; }
  .quote-box { color: var(--muted); font-style: italic; font-size: .88rem; border-left: 3px solid var(--border); padding-left: .8rem; margin-top: .35rem; }
  .logo-thumb { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 8px; padding: 4px; border: 1px solid var(--border); flex-shrink: 0; }
  .preview-img { max-height: 64px; max-width: 180px; object-fit: contain; background: #fff; border-radius: 6px; padding: 4px; border: 1px solid var(--border); display: block; margin-bottom: .5rem; }
  .field input[type="file"] { padding: .45rem; color: var(--muted); }
  .field .check { display: flex; align-items: center; gap: .5rem; font-size: .88rem; color: var(--muted); margin-top: .5rem; }
  .field .check input { width: auto; }
  .toast { position: fixed; bottom: 1.25rem; right: 1.25rem; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: .8rem 1.1rem; border-radius: 10px; font-size: .9rem; box-shadow: 0 8px 30px rgba(0,0,0,.4); transform: translateY(120%); transition: .25s; z-index: 50; }
  .toast.show { transform: translateY(0); }
  .toast.ok { border-color: var(--acc2); }
  .toast.err { border-color: var(--danger); }
  .empty { color: var(--muted); font-style: italic; padding: 1.5rem; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
  .link { color: var(--acc); text-decoration: none; }
  .link:hover { text-decoration: underline; }
  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(5,6,12,.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .modal.wide { max-width: 720px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.4rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
  .modal-head h2 { font-family: var(--mono); font-size: 1rem; font-weight: 650; }
  .modal-close { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 1rem; line-height: 1; }
  .modal-close:hover { color: var(--danger); border-color: var(--danger); }
  .modal-body { padding: 1.4rem; }
  .modal-text { color: var(--muted); line-height: 1.6; margin-bottom: 1.4rem; }
  .modal-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>
<script>
(function(){
  const API = ''
  let TOKEN = localStorage.getItem('sb_token') || ''
  const TAB = { projects: 'Projects', testimonials: 'Testimonials', logos: 'Client Logos', certificates: 'Certificates', reviews: 'Reviews' }
  const CATEGORIES = { client: 'Client Project', saas: 'SaaS Template', apps: 'Systems & Apps', template: 'Template' }
  function catLabel(c) { return CATEGORIES[c] || 'Client Project' }
  let state = { tab: 'projects', projects: [], testimonials: [], logos: [], certificates: [], reviews: [], form: {} }
  const $app = document.getElementById('app')
  const $toast = document.getElementById('toast')
  let toastTimer = null
  function toast(msg, ok) {
    $toast.textContent = msg
    $toast.className = 'toast show ' + (ok ? 'ok' : 'err')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { $toast.className = 'toast' }, 2600)
  }
  const $modalRoot = document.getElementById('modal-root')
  let modalFocusBack = null
  function openModal({ title = '', body = '', wide = false } = {}) {
    closeModal()
    modalFocusBack = document.activeElement
    $modalRoot.innerHTML = `
      <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal${wide ? ' wide' : ''}">
          <div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button></div>
          <div class="modal-body">${body}</div>
        </div>
      </div>`
    const ov = document.getElementById('modal-overlay')
    document.getElementById('modal-close').addEventListener('click', closeModal)
    ov.addEventListener('click', (e) => { if (e.target === ov) closeModal() })
    const first = ov.querySelector('input, select, textarea')
    if (first) first.focus()
  }
  function closeModal() {
    const ov = document.getElementById('modal-overlay')
    if (ov) ov.remove()
    if (modalFocusBack && modalFocusBack.focus) modalFocusBack.focus()
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('modal-overlay')) closeModal()
  })
  function confirmModal(message, { dangerText = 'Delete', onConfirm = async () => {} } = {}) {
    openModal({
      title: 'Are you sure?',
      body: `<div class="modal-text">${esc(message)}</div>
        <div class="modal-actions">
          <button type="button" class="btn primary" id="cf-ok">${esc(dangerText)}</button>
          <button type="button" class="btn" id="cf-cancel">Cancel</button>
        </div>`,
    })
    document.getElementById('cf-cancel').addEventListener('click', closeModal)
    document.getElementById('cf-ok').addEventListener('click', async () => {
      closeModal()
      try { await onConfirm() } catch (e) { toast(e.message, false) }
    })
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  }
  function domFile(id) {
    const el = document.getElementById(id)
    return el && el.files && el.files[0] ? el.files[0] : null
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true } catch {
      try {
        const ta = document.createElement('textarea')
        ta.value = text
        ta.style.position = 'fixed'
        ta.style.opacity = '0'
        document.body.appendChild(ta)
        ta.select()
        document.execCommand('copy')
        document.body.removeChild(ta)
        return true
      } catch { return false }
    }
  }
  async function copyReviewLink(name) {
    const link = location.origin + '/review?c=' + encodeURIComponent(name)
    const ok = await copyText(link)
    toast(ok ? 'Review link copied' : 'Could not copy', ok)
  }
  function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' }
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN
    return fetch(API + path, { ...opts, headers }).then(async res => {
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
      return data
    })
  }

  function apiForm(path, { method = 'POST', fields = {}, file = null, clearImage = false, pdfFile = null, clearPdf = false } = {}) {
    const fd = new FormData()
    for (const [k, v] of Object.entries(fields)) fd.append(k, v)
    if (file) fd.append('image', file)
    if (clearImage) fd.append('clearImage', '1')
    if (pdfFile) fd.append('pdf', pdfFile)
    if (clearPdf) fd.append('clearPdf', '1')
    const headers = {}
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN
    return fetch(API + path, { method, headers, body: fd }).then(async res => {
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
      return data
    })
  }

  /* ---------- LOGIN ---------- */
  function renderLogin() {
    $app.innerHTML = `
      <div class="auth-box">
        <div class="logo">Stryg.Bytes<span> // admin</span></div>
        <h1>Sign in</h1>
        <p>Manage projects, testimonials, client logos, and the review inbox.</p>
        <form id="login-form">
          <div class="field"><label>Username</label><input id="u" autocomplete="username" required></div>
          <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" required></div>
          <button class="btn primary" style="width:100%;justify-content:center" type="submit">Sign in →</button>
          <div class="err" id="login-err"></div>
        </form>
      </div>`
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const u = document.getElementById('u').value.trim()
      const p = document.getElementById('p').value
      try {
        const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) })
        TOKEN = r.token
        localStorage.setItem('sb_token', TOKEN)
        await boot()
      } catch (err) {
        document.getElementById('login-err').textContent = err.message
      }
    })
  }

  function logout() {
    TOKEN = ''
    localStorage.removeItem('sb_token')
    renderLogin()
  }

  /* ---------- DATA ---------- */
  async function load() {
    const [projects, testimonials, logos, certificates, reviews] = await Promise.all([
      api('/api/projects'), api('/api/testimonials'), api('/api/logos/all'), api('/api/certificates/all'), api('/api/reviews')
    ])
    state.projects = projects; state.testimonials = testimonials; state.logos = logos; state.certificates = certificates; state.reviews = reviews
  }

  /* ---------- RENDER ---------- */
  function renderShell() {
    const pendingCount = state.reviews.filter(r => r.status === 'pending').length
    $app.innerHTML = `
      <div class="wrap">
        <header>
          <div class="logo">Stryg.Bytes<span> // admin</span></div>
          <div class="row">
            <button class="btn" onclick="location.href='/'">View site</button>
            <button class="btn sm" onclick="SB.logout()">Sign out</button>
          </div>
        </header>
        <div class="tabs">
          ${Object.entries(TAB).map(([k, v]) => `
            <button class="tab ${state.tab === k ? 'active' : ''}" data-tab="${k}">${v}${k === 'reviews' && pendingCount ? `<span class="badge">${pendingCount}</span>` : ''}</button>
          `).join('')}
        </div>
        <div id="tab-body"></div>
      </div>`
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      state.tab = t.dataset.tab; state.form = {}; closeModal(); render()
    }))
    renderTab()
  }

  function render() { renderShell() }

  function renderTab() {
    const body = document.getElementById('tab-body')
    if (!body) return
    if (state.tab === 'projects') body.innerHTML = tabProjects()
    else if (state.tab === 'testimonials') body.innerHTML = tabTestimonials()
    else if (state.tab === 'logos') body.innerHTML = tabLogos()
    else if (state.tab === 'certificates') body.innerHTML = tabCertificates()
    else if (state.tab === 'reviews') body.innerHTML = tabReviews()
    wireTab()
  }

  function tabProjects() {
    return `
      <div class="titlebar"><h2>Projects</h2>
        <button class="btn primary sm" onclick="SB.newProject()">+ Add project</button>
      </div>
      <div class="card-list">
        ${state.projects.map(p => `
          <div class="item">
            <div class="grow">
              <div class="title">${esc(p.name)}</div>
              <div class="sub">${esc(p.desc)}</div>
              <div class="tags"><span class="tag">${catLabel(p.category)}</span>${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
              ${p.url ? `<a class="link" href="${esc(p.url)}" target="_blank" rel="noopener" style="font-size:.82rem">↗ ${esc(p.url).replace(/^https?:\/\//,'')}</a>` : ''}
            </div>
            <div class="row">
              <button class="btn sm" onclick="SB.copyReviewLinkById(${p.id})">Copy review link</button>
              <button class="btn sm" onclick="SB.editProject(${p.id})">Edit</button>
              <button class="btn sm danger" onclick="SB.delProject(${p.id})">Delete</button>
            </div>
          </div>`).join('') || '<div class="empty">No projects yet.</div>'}
      </div>
    `
  }

  function tabTestimonials() {
    return `
      <div class="titlebar"><h2>Testimonials (live on site)</h2>
        <button class="btn primary sm" onclick="SB.newTestimonial()">+ Add manually</button>
      </div>
      <div class="card-list">
        ${state.testimonials.map(t => `
          <div class="item">
            <div class="grow">
              <div class="row"><div class="title">${esc(t.name)}</div><div class="stars">${'★'.repeat(Math.max(1, t.stars))}</div></div>
              <div class="sub">${esc(t.role)}</div>
              <div class="quote-box">${esc(t.quote)}</div>
            </div>
            <div class="row">
              <button class="btn sm" onclick="SB.editTestimonial(${t.id})">Edit</button>
              <button class="btn sm danger" onclick="SB.delTestimonial(${t.id})">Delete</button>
            </div>
          </div>`).join('') || '<div class="empty">No approved testimonials yet.</div>'}
      </div>
    `
  }

  function tabLogos() {
    return `
      <div class="titlebar"><h2>Client logos (marquee)</h2><button class="btn primary sm" onclick="SB.newLogo()">+ Add logo</button></div>
      <div class="card-list">
        ${state.logos.map(l => `
          <div class="item">
            ${l.image ? `<img class="logo-thumb" src="${esc(l.image)}" alt="">` : ''}
            <div class="grow"><div class="title">${esc(l.name)}</div>
              <div class="sub">sort ${l.sort} · ${l.enabled ? 'enabled' : 'hidden'}${l.image ? ' · has image' : ' · text only'}</div></div>
            <div class="row">
              <button class="btn sm" onclick="SB.toggleLogo(${l.id})">${l.enabled ? 'Hide' : 'Show'}</button>
              <button class="btn sm" onclick="SB.editLogo(${l.id})">Edit</button>
              <button class="btn sm danger" onclick="SB.delLogo(${l.id})">Delete</button>
            </div>
          </div>`).join('') || '<div class="empty">No logos yet.</div>'}
      </div>
    `
  }

  function tabCertificates() {
    return `
      <div class="titlebar"><h2>Certificates (live on site)</h2><button class="btn primary sm" onclick="SB.newCertificate()">+ Add certificate</button></div>
      <div class="card-list">
        ${state.certificates.map(c => `
          <div class="item">
            ${c.image ? `<img class="logo-thumb" src="${esc(c.image)}" alt="">` : ''}
            <div class="grow">
              <div class="title">${esc(c.name)}</div>
              <div class="sub">${esc(c.issuer)} · ${esc(c.date)} · sort ${c.sort} · ${c.enabled ? 'enabled' : 'hidden'}${c.link ? ' · has link' : ''}${c.pdf ? ' · has PDF' : ''}${c.image ? ' · has image' : ''}</div>
            </div>
            <div class="row">
              <button class="btn sm" onclick="SB.toggleCertificate(${c.id})">${c.enabled ? 'Hide' : 'Show'}</button>
              <button class="btn sm" onclick="SB.editCertificate(${c.id})">Edit</button>
              <button class="btn sm danger" onclick="SB.delCertificate(${c.id})">Delete</button>
            </div>
          </div>`).join('') || '<div class="empty">No certificates yet.</div>'}
      </div>
    `
  }

  function tabReviews() {
    const pending = state.reviews.filter(r => r.status === 'pending')
    const done = state.reviews.filter(r => r.status !== 'pending')
    return `
      <div class="titlebar"><h2>Review inbox</h2></div>
      <div class="panel" style="margin-bottom:1.25rem">
        <div class="titlebar"><h2>Send a review request</h2></div>
        <div class="muted" style="margin-bottom:.8rem">Copy a link your client opens to submit a review — no login needed.</div>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap">
          <input id="rl-name" placeholder="e.g. TanKen&rsquo;s Resort" style="flex:1;min-width:220px">
          <button class="btn primary" onclick="SB.copyReviewLinkFromInput()">Copy link</button>
        </div>
      </div>
      ${pending.length ? `<div class="panel">
        <div class="muted" style="margin-bottom:.8rem">Pending — approve to publish to the live site&rsquo;s testimonials.</div>
        ${pending.map(r => reviewItem(r, true)).join('')}
      </div>` : '<div class="empty">No pending reviews. New client submissions will appear here.</div>'}
      ${done.length ? `<div class="panel" style="margin-top:1.25rem"><div class="muted" style="margin-bottom:.8rem">Approved &amp; published</div>
        ${done.map(r => reviewItem(r, false)).join('')}
      </div>` : ''}
    `
  }

  function reviewItem(r, isPending) {
    return `
      <div class="item" style="margin-bottom:.6rem">
        <div class="grow">
          <div class="row"><div class="title">${esc(r.name)}</div><div class="stars">${'★'.repeat(Math.max(1, r.stars))}</div><span class="status ${r.status}">${r.status}</span></div>
          <div class="sub">${esc(r.project)} · ${esc(r.role)} · ${esc(r.created_at)}</div>
          <div class="quote-box">${esc(r.quote)}</div>
        </div>
        <div class="row">
          ${isPending ? `<button class="btn sm green" onclick="SB.approveReview(${r.id})">Approve</button>` : ''}
          <button class="btn sm danger" onclick="SB.delReview(${r.id})">Delete</button>
        </div>
      </div>`
  }

  function wireTab() {
    // nothing extra needed; handlers attached via inline onclick -> SB
  }

  /* ---------- FORM MODALS ---------- */
  function projectFormModal() {
    const f = state.form
    const isEdit = f?.mode === 'edit'
    openModal({
      title: isEdit ? 'Edit project' : 'New project',
      wide: true,
      body: `
        <div class="form-grid">
          <div class="field full"><label>Name</label><input id="pf-name" value="${esc(f?.name || '')}"></div>
          <div class="field full"><label>Description</label><textarea id="pf-desc">${esc(f?.desc || '')}</textarea></div>
          <div class="field"><label>Tags (comma-separated)</label><input id="pf-tags" value="${esc((f?.tags || []).join(', '))}" placeholder="HTML/CSS, JS, Booking"></div>
          <div class="field"><label>Category</label>
            <select id="pf-category">${Object.entries(CATEGORIES).map(([v, l]) => `<option value="${v}" ${(f?.category || 'client') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          </div>
          <div class="field"><label>URL (live site, optional)</label><input id="pf-url" value="${esc(f?.url || '')}" placeholder="https://example.com"></div>
          <div class="field"><label>Demo URL (optional)</label><input id="pf-demo" value="${esc(f?.demoUrl || '')}" placeholder="https://demo.example.com"></div>
          <div class="field full"><label>Screenshot ${isEdit && f?.image ? '(leave empty to keep current)' : '(optional — shows on the card)'}</label>
            <img class="preview-img" id="pf-preview" src="${esc(f?.image || '')}" alt="preview" ${f?.image ? '' : 'hidden'} style="max-width:100%;max-height:140px;border:1px solid var(--border);border-radius:8px">
            <input id="pf-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="SB.previewScreenshot(this)">
            ${isEdit && f?.image ? `<label class="check"><input id="pf-clear" type="checkbox" value="1"> Remove screenshot</label>` : ''}
          </div>
          <div class="field"><label>Thumb style</label>
            <select id="pf-thumb">${['resort','corporate','ai','motion','wave'].map(t => `<option ${f?.thumb === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Sort order</label><input id="pf-sort" type="number" value="${f?.sort ?? 0}"></div>
          <div class="field full" style="display:flex;gap:.6rem;align-items:center">
            <button class="btn primary" onclick="SB.saveProject()">${isEdit ? 'Save changes' : 'Add project'}</button>
            <button class="btn" onclick="SB.cancelForm()">Cancel</button>
          </div>
        </div>`,
    })
  }

  function testimonialFormModal() {
    const f = state.form
    const isEdit = f?.mode === 'testimonial-edit'
    openModal({
      title: isEdit ? 'Edit testimonial' : 'New testimonial',
      body: `
        <div class="form-grid">
          <div class="field"><label>Name</label><input id="tf-name" value="${esc(f?.name || '')}"></div>
          <div class="field"><label>Role &amp; company</label><input id="tf-role" value="${esc(f?.role || '')}"></div>
          <div class="field full"><label>Quote</label><textarea id="tf-quote">${esc(f?.quote || '')}</textarea></div>
          <div class="field"><label>Stars (1-5)</label><input id="tf-stars" type="number" min="1" max="5" value="${f?.stars || 5}"></div>
          <div class="field full" style="display:flex;gap:.6rem;align-items:center">
            <button class="btn primary" onclick="SB.saveTestimonial()">${isEdit ? 'Save changes' : 'Add'}</button>
            <button class="btn" onclick="SB.cancelForm()">Cancel</button>
          </div>
        </div>`,
    })
  }

  function logoFormModal() {
    const f = state.form
    const isEdit = !!f?.id
    openModal({
      title: isEdit ? 'Edit client logo' : 'New client logo',
      body: `
        <div class="form-grid">
          <div class="field"><label>Company name (used as image alt)</label><input id="lf-name" value="${esc(f?.name || '')}" placeholder="Client Co."></div>
          <div class="field"><label>Sort order</label><input id="lf-sort" type="number" value="${f?.sort ?? 0}"></div>
          <div class="field full"><label>Logo image ${isEdit ? '(leave empty to keep current)' : '(optional)'}</label>
            <img class="preview-img" id="lf-preview" src="${esc(f?.image || '')}" alt="preview" ${f?.image ? '' : 'hidden'} style="max-height:64px">
            <input id="lf-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="SB.previewLogo(this)">
            ${isEdit && f?.image ? `<label class="check"><input id="lf-clear" type="checkbox" value="1"> Remove current image</label>` : ''}
          </div>
          <div class="field full" style="display:flex;gap:.6rem;align-items:center">
            <button class="btn primary" onclick="SB.saveLogo()">${isEdit ? 'Save changes' : 'Add logo'}</button>
            <button class="btn" onclick="SB.cancelForm()">Cancel</button>
          </div>
        </div>`,
    })
  }

  function certificateFormModal() {
    const f = state.form
    const isEdit = !!f?.id
    openModal({
      title: isEdit ? 'Edit certificate' : 'New certificate',
      wide: true,
      body: `
        <div class="form-grid">
          <div class="field full"><label>Certificate name</label><input id="cf-name" value="${esc(f?.name || '')}" placeholder="ISO/IEC 27001 Cybersecurity Masterclass"></div>
          <div class="field"><label>Issuer / organization</label><input id="cf-issuer" value="${esc(f?.issuer || '')}" placeholder="GSDC"></div>
          <div class="field"><label>Date</label><input id="cf-date" value="${esc(f?.date || '')}" placeholder="August 2026"></div>
          <div class="field full"><label>Verification link (optional — opens external verification page)</label><input id="cf-link" value="${esc(f?.link || '')}" placeholder="https://..."></div>
          <div class="field"><label>Sort order</label><input id="cf-sort" type="number" value="${f?.sort ?? 0}"></div>
          <div class="field"><label>Enabled on site</label>
            <select id="cf-enabled"><option value="1" ${f?.enabled !== 0 ? 'selected' : ''}>Enabled</option><option value="0" ${f?.enabled === 0 ? 'selected' : ''}>Hidden</option></select>
          </div>
          <div class="field full"><label>Certificate image ${isEdit && f?.image ? '(leave empty to keep current)' : '(optional — thumbnail on the card)'}</label>
            <img class="preview-img" id="cf-preview" src="${esc(f?.image || '')}" alt="preview" ${f?.image ? '' : 'hidden'} style="max-width:100%;max-height:150px;border:1px solid var(--border);border-radius:8px">
            <input id="cf-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="SB.previewCertImage(this)">
            ${isEdit && f?.image ? `<label class="check"><input id="cf-clear" type="checkbox" value="1"> Remove current image</label>` : ''}
          </div>
          <div class="field full"><label>PDF file ${isEdit && f?.pdf ? '(leave empty to keep current)' : '(optional — opens the document on click if no link is set)'}</label>
            ${f?.pdf ? `<div class="muted" style="margin-bottom:.4rem;font-size:.82rem">Current: ${esc(f.pdf)}</div>` : ''}
            <input id="cf-pdf" type="file" accept="application/pdf,.pdf">
            ${isEdit && f?.pdf ? `<label class="check"><input id="cf-clear-pdf" type="checkbox" value="1"> Remove current PDF</label>` : ''}
          </div>
          <div class="field full" style="display:flex;gap:.6rem;align-items:center">
            <button class="btn primary" onclick="SB.saveCertificate()">${isEdit ? 'Save changes' : 'Add certificate'}</button>
            <button class="btn" onclick="SB.cancelForm()">Cancel</button>
          </div>
        </div>`,
    })
  }

  /* ---------- ACTIONS ---------- */
  const SB = window.SB = {
    logout,
    newProject() { state.form = { mode: 'new', name: '', desc: '', tags: [], url: '', demoUrl: '', image: '', category: 'client', thumb: 'wave', sort: state.projects.length + 1 }; projectFormModal() },
    editProject(id) {
      const p = state.projects.find(x => x.id === id); if (!p) return
      state.form = { mode: 'edit', id: p.id, name: p.name, desc: p.desc, tags: p.tags.map(t => t), url: p.url, demoUrl: p.demoUrl || '', image: p.image || '', category: p.category, thumb: p.thumb, sort: p.sort }; projectFormModal()
    },
    cancelForm() { closeModal(); state.form = {} },
    copyReviewLinkById(id) {
      const p = state.projects.find(x => x.id === id); if (!p) return
      copyReviewLink(p.name)
    },
    copyReviewLinkFromInput() {
      const name = (document.getElementById('rl-name') || {}).value || ''
      if (!name.trim()) return toast('Enter a client / project name', false)
      copyReviewLink(name.trim())
    },
    async saveProject() {
      const f = state.form
      const payload = {
        name: document.getElementById('pf-name').value.trim(),
        desc: document.getElementById('pf-desc').value.trim(),
        tags: document.getElementById('pf-tags').value.split(',').map(s => s.trim()).filter(Boolean),
        category: document.getElementById('pf-category').value,
        url: document.getElementById('pf-url').value.trim(),
        demoUrl: document.getElementById('pf-demo').value.trim(),
        thumb: document.getElementById('pf-thumb').value,
        sort: Number(document.getElementById('pf-sort').value) || 0
      }
      if (!payload.name) return toast('Name is required', false)
      const fileInput = document.getElementById('pf-image')
      const file = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null
      const clearInput = document.getElementById('pf-clear')
      const clearImage = !!(clearInput && clearInput.checked)
      try {
        if (f.mode === 'edit') await api('/api/projects/' + f.id, { method: 'PUT', body: JSON.stringify(payload) })
        else {
          const created = await api('/api/projects', { method: 'POST', body: JSON.stringify(payload) })
          f.id = created.id
        }
        if (file || clearImage) await apiForm('/api/projects/' + f.id + '/image', { method: 'PUT', file, clearImage })
        closeModal(); state.form = {}; await load(); render(); toast('Project saved', true)
      } catch (e) { toast(e.message, false) }
    },
    async delProject(id) { confirmModal('Delete this project permanently?', { onConfirm: async () => { await api('/api/projects/' + id, { method: 'DELETE' }); await load(); render(); toast('Project deleted', true) } }) },
    newTestimonial() { state.form = { mode: 'testimonial-new', name: '', role: '', quote: '', stars: 5 }; testimonialFormModal() },
    editTestimonial(id) { const t = state.testimonials.find(x => x.id === id); if (!t) return; state.form = { mode: 'testimonial-edit', id: t.id, name: t.name, role: t.role, quote: t.quote, stars: t.stars }; testimonialFormModal() },
    async saveTestimonial() {
      const payload = {
        name: document.getElementById('tf-name').value.trim(),
        role: document.getElementById('tf-role').value.trim(),
        quote: document.getElementById('tf-quote').value.trim(),
        stars: Number(document.getElementById('tf-stars').value) || 5
      }
      if (!payload.name || !payload.quote) return toast('Name and quote are required', false)
      try {
        if (state.form.mode === 'testimonial-edit') await api('/api/testimonials/' + state.form.id, { method: 'PUT', body: JSON.stringify(payload) })
        else await api('/api/testimonials', { method: 'POST', body: JSON.stringify(payload) })
        closeModal(); state.form = {}; await load(); render(); toast('Testimonial saved', true)
      } catch (e) { toast(e.message, false) }
    },
    async delTestimonial(id) { confirmModal('Delete this testimonial permanently?', { onConfirm: async () => { await api('/api/testimonials/' + id, { method: 'DELETE' }); await load(); render(); toast('Deleted', true) } }) },
    newLogo() { state.form = { mode: 'logo', name: '', sort: state.logos.length }; logoFormModal() },
    editLogo(id) { const l = state.logos.find(x => x.id === id); if (!l) return; state.form = { mode: 'logo', id: l.id, name: l.name, sort: l.sort, image: l.image }; logoFormModal() },
    previewLogo(input) {
      const img = document.getElementById('lf-preview')
      if (!img) return
      const f = input.files && input.files[0]
      if (!f) return
      img.src = URL.createObjectURL(f)
      img.hidden = false
    },
    previewScreenshot(input) {
      const img = document.getElementById('pf-preview')
      if (!img) return
      const f = input.files && input.files[0]
      if (!f) return
      img.src = URL.createObjectURL(f)
      img.hidden = false
    },
    async saveLogo() {
      const f = state.form
      const name = document.getElementById('lf-name').value.trim()
      const sort = Number(document.getElementById('lf-sort').value) || 0
      if (!name) return toast('Name is required', false)
      const fileInput = document.getElementById('lf-image')
      const file = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null
      const clear = document.getElementById('lf-clear')
      const clearImage = !!(clear && clear.checked)
      const body = { fields: { name, sort: String(sort) }, file, clearImage }
      try {
        if (f.id) await apiForm('/api/logos/' + f.id, { method: 'PUT', ...body })
        else await apiForm('/api/logos', { method: 'POST', ...body })
        closeModal(); state.form = {}; await load(); render(); toast('Logo saved', true)
      } catch (e) { toast(e.message, false) }
    },
    async toggleLogo(id) { const l = state.logos.find(x => x.id === id); if (!l) return; try { await api('/api/logos/' + id, { method: 'PUT', body: JSON.stringify({ enabled: l.enabled ? 0 : 1 }) }); await load(); render() } catch (e) { toast(e.message, false) } },
    async delLogo(id) { confirmModal('Delete this logo?', { onConfirm: async () => { await api('/api/logos/' + id, { method: 'DELETE' }); await load(); render(); toast('Logo deleted', true) } }) },
    newCertificate() { state.form = { mode: 'certificate', name: '', issuer: '', date: '', link: '', image: '', pdf: '', sort: state.certificates.length + 1, enabled: 1 }; certificateFormModal() },
    editCertificate(id) { const c = state.certificates.find(x => x.id === id); if (!c) return; state.form = { mode: 'certificate', id: c.id, name: c.name, issuer: c.issuer, date: c.date, link: c.link, image: c.image, pdf: c.pdf, sort: c.sort, enabled: c.enabled }; certificateFormModal() },
    previewCertImage(input) {
      const img = document.getElementById('cf-preview')
      if (!img) return
      const f = input.files && input.files[0]
      if (!f) return
      img.src = URL.createObjectURL(f)
      img.hidden = false
    },
    async saveCertificate() {
      const f = state.form
      const fields = {
        name: (document.getElementById('cf-name').value || '').trim(),
        issuer: (document.getElementById('cf-issuer').value || '').trim(),
        cert_date: (document.getElementById('cf-date').value || '').trim(),
        link: (document.getElementById('cf-link').value || '').trim(),
        sort: String(Number(document.getElementById('cf-sort').value) || 0),
        enabled: document.getElementById('cf-enabled').value === '1' ? '1' : '0'
      }
      if (!fields.name) return toast('Name is required', false)
      const file = domFile('cf-image')
      const clearImage = !!(document.getElementById('cf-clear') || {}).checked
      const pdfFile = domFile('cf-pdf')
      const clearPdf = !!(document.getElementById('cf-clear-pdf') || {}).checked
      const body = { fields, file, clearImage, pdfFile, clearPdf }
      try {
        if (f.id) await apiForm('/api/certificates/' + f.id, { method: 'PUT', ...body })
        else await apiForm('/api/certificates', { method: 'POST', ...body })
        closeModal(); state.form = {}; await load(); render(); toast('Certificate saved', true)
      } catch (e) { toast(e.message, false) }
    },
    async toggleCertificate(id) { const c = state.certificates.find(x => x.id === id); if (!c) return; try { await api('/api/certificates/' + id, { method: 'PUT', body: JSON.stringify({ enabled: c.enabled ? 0 : 1 }) }); await load(); render() } catch (e) { toast(e.message, false) } },
    async delCertificate(id) { confirmModal('Delete this certificate?', { onConfirm: async () => { await api('/api/certificates/' + id, { method: 'DELETE' }); await load(); render(); toast('Certificate deleted', true) } }) },
    async approveReview(id) { try { await api('/api/reviews/' + id + '/approve', { method: 'POST' }); await load(); render(); toast('Review approved & published', true) } catch (e) { toast(e.message, false) } },
    async delReview(id) { confirmModal('Delete this review?', { onConfirm: async () => { await api('/api/reviews/' + id, { method: 'DELETE' }); await load(); render(); toast('Review deleted', true) } }) }
  }

  async function boot() {
    if (!TOKEN) return renderLogin()
    try {
      await load()
      render()
    } catch (err) {
      // token invalid/expired
      TOKEN = ''; localStorage.removeItem('sb_token'); renderLogin()
    }
  }
  boot()
})()
</script>
</body>
</html>
