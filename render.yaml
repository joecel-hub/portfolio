# Render free tier. There is no persistent disk and outbound SMTP ports are blocked, so:
#  - the SQLite DB lives in the repo checkout (server/portfolio.db) and admin
#    edits are committed back to main by server/pushback.js (needs GIT_PAT);
#  - the contact form sends through Resend's HTTPS API (RESEND_API_KEY).
# On a paid plan with a disk instead: add a disk at /data, set DB_FILE=/data/portfolio.db
# and UPLOAD_DIR=/data/uploads (pushback then switches itself off), and SMTP_* works too.
services:
  - type: web
    name: gio-portfolio
    runtime: node
    repo: https://github.com/joecel-hub/portfolio
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GIT_PAT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        sync: false
